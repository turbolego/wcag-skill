name: Publish to ClawHub

on:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "README.md"
      - "templates/**"
      - "scripts/**"
      - "references/**"
      - "benchmark/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      owner: turbolego
      skill_path: "."
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
