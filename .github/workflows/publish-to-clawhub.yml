name: Publish to ClawHub

# Keep the manual entry point on the same tested multipart publisher as pushes.
on:
  workflow_dispatch:
    inputs:
      bump_version:
        description: "Create a new release (disable to retry the declared version)"
        type: boolean
        default: true
      dry_run:
        description: "Validate and preview without committing or publishing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/publish-web.yml
    with:
      bump_version: ${{ inputs.bump_version }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
