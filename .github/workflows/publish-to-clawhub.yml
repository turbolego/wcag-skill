name: Publish to ClawHub

# Manual-only: the reusable CLI-based publisher
# (openclaw/clawhub/.github/workflows/skill-publish.yml) currently fails
# with "Invalid publish output: 'pending-publication'" whenever a prior
# publish attempt for the same version is still undergoing security scan
# review; its status-key mapping doesn't recognize that state
# (see runs 33077893243 and 35492158592). Note that the underlying CLI
# publish can still succeed server-side even though the workflow reports
# failure — run 35492158592 actually published version 2.0.4 to ClawHub
# while the job exited non-zero, which silently drifted the live version
# ahead of SKILL.md. To make that drift harmless, the bump-version job
# below auto-increments the version (via scripts/bump-skill-version.py)
# past whatever is highest of the checked-in SKILL.md version and every
# version ClawHub already has on record, then commits that bump back to
# the branch before the publish job runs against it — so nobody needs to
# hand-bump SKILL.md or reconcile it against the live version anymore.
# publish-web.yml is the active push-triggered publisher until the
# upstream "pending-publication" bug is fixed. Both workflows share the
# `clawhub-publish` concurrency group below (with cancel-in-progress
# disabled) so a manual run here and a push-triggered publish-web.yml run
# can never bump/publish concurrently — without that, both could read the
# same highest registry version, choose the same next patch, and race
# each other's push/publish.
on:
  workflow_dispatch:

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Auto-increment skill version
        id: bump
        run: |
          version="$(python3 scripts/bump-skill-version.py --write)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice:: Next skill version: $version"

      - name: Commit and push version bump
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL.md README.md skill-card.md
          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "ci: bump wcag-skill version to ${{ steps.bump.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: bump-version
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      owner: turbolego
      skill_path: "."
      dry_run: false
      ref: ${{ needs.bump-version.outputs.sha }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

