name: Publish to ClawHub

on:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "README.md"
      - "templates/**"
      - "scripts/**"
      - "references/**"
  workflow_dispatch:

jobs:
  publish:
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@main
    with:
      owner: turbolego
      skill_path: "."
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}