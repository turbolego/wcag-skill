name: Publish to ClawHub (Web Upload)

# SKILL.md is canonical. Every new release updates all mirrors in one commit;
# retries publish that declared version rather than creating another release.
on:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "skill-card.md"
      - "README.md"
      - "LICENSE"
      - "references/**"
      - "scripts/**"
      - "templates/**"
      - "benchmark/**"
      - "package.json"
      - "package-lock.json"
      - ".clawhubignore"
      - ".github/workflows/publish-web.yml"
      - ".github/workflows/publish-to-clawhub.yml"
  workflow_dispatch:
    inputs:
      bump_version:
        description: "Create a new release (disable to retry the declared version)"
        type: boolean
        default: true
      dry_run:
        description: "Validate and preview without committing or publishing"
        type: boolean
        default: false
  workflow_call:
    inputs:
      bump_version:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: false
    secrets:
      CLAWHUB_TOKEN:
        required: true

permissions:
  contents: write

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Use current main after acquiring concurrency, never an old queued SHA.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate release tooling and version mirrors
        run: |
          python3 scripts/read-version.py --check
          python3 tests/test-bump-skill-version.py
          python3 tests/test-publish-web.py
          python3 tests/test-clawhub-force-sync.py

      - name: Resolve target and ClawHub state
        id: resolve
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CREATE_RELEASE: ${{ inputs.dry_run != true && github.run_attempt == 1 && (github.event_name == 'push' || inputs.bump_version) }}
        run: |
          TARGET="$(python3 scripts/read-version.py --check)"
          python3 - "$TARGET" <<'PY'
          import json, os, sys
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          target = sys.argv[1]
          base = "https://clawhub.ai/api/v1/skills/wcag-skill"
          def get(url):
              with urlopen(url, timeout=60) as response:
                  return json.load(response)
          live = get(base)["latestVersion"]["version"]
          try:
              request = Request(
                  f"{base}/versions/{target}/publication?ownerHandle=turbolego",
                  headers={"Authorization": "Bearer " + os.environ["CLAWHUB_TOKEN"]},
              )
              publication = get(request)["publication"]
              if publication["version"] != target:
                  raise SystemExit(f"Publication API version mismatch: {publication}")
              recorded = True
              print(f"Existing upload: {publication}")
              if os.environ.get("CREATE_RELEASE") == "true" and publication["stage"] != "published":
                  raise SystemExit(
                      f"Refusing to bump past retained release {target}: {publication}. "
                      "Recover this upload first; retry with bump_version=false."
                  )
          except HTTPError as error:
              if error.code != 404:
                  raise
              recorded = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"target={target}\nlive={live}\nrecorded={int(recorded)}\n")
          print(f"target(repo)={target} clawhub-live={live} target-already-recorded={recorded}")
          PY

      - name: Create synchronized release version
        if: ${{ inputs.dry_run != true && github.run_attempt == 1 && (github.event_name == 'push' || inputs.bump_version) }}
        run: |
          VERSION="$(python3 scripts/bump-skill-version.py --write)"
          python3 scripts/read-version.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL.md README.md skill-card.md package.json package-lock.json
          git commit -m "ci: release wcag-skill $VERSION" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main

      - name: Read exact release target
        id: target
        run: echo "version=$(python3 scripts/read-version.py --check)" >> "$GITHUB_OUTPUT"

      - name: Dry run
        if: ${{ inputs.dry_run == true }}
        run: |
          python3 scripts/publish-web.py --dry-run --expected-version "${{ steps.target.outputs.version }}"
          python3 scripts/clawhub-force-sync.py --dry-run --version "${{ steps.target.outputs.version }}"

      - name: Publish to ClawHub if target is not recorded
        if: ${{ inputs.dry_run != true && (steps.target.outputs.version != steps.resolve.outputs.target || steps.resolve.outputs.recorded == '0') }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: python3 scripts/publish-web.py --expected-version "${{ steps.target.outputs.version }}"

      - name: Sync ClawHub live version to target
        if: ${{ inputs.dry_run != true }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: python3 scripts/clawhub-force-sync.py --version "${{ steps.target.outputs.version }}"

      - name: Verify published release
        if: ${{ inputs.dry_run != true }}
        run: |
          python3 scripts/read-version.py --check
          python3 - "${{ steps.target.outputs.version }}" <<'PY'
          import json, sys
          from urllib.request import urlopen
          with urlopen("https://clawhub.ai/api/v1/skills/wcag-skill", timeout=60) as response:
              data = json.load(response)
          target = sys.argv[1]
          live = data["latestVersion"]["version"]
          latest = data["skill"]["tags"].get("latest")
          if live != target or latest != target:
              raise SystemExit(f"Release not in sync: target={target}, live={live}, latest tag={latest}")
          print(f"Verified: repository, ClawHub live version and latest tag are all {target}")
          PY
