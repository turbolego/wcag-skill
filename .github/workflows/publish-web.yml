name: Publish to ClawHub (Web Upload)

# Active publisher that FORCES ClawHub's live version to match the repo.
#
# Old design (bug): auto-bumped the version off the *checked-in* SKILL.md and
# *committed* the new number back to the branch, then passively polled ClawHub
# for up to 30 minutes waiting for its security-scan queue to promote the
# version. Because a prior run's publish can get stuck in "pending", the
# checked-in version drifts ahead of everything ClawHub has actually recorded,
# and every subsequent run bumps further ahead — so GitHub and ClawHub diverge
# permanently (observed: GitHub SKILL.md 2.0.20 vs ClawHub live 2.0.14).
#
# New design: the repo's declared SKILL.md version is the source of truth and is
# never auto-bumped off its own drifted value. Each run:
#   1. resolves the target version (SKILL.md frontmatter) + ClawHub's live version;
#   2. publishes the target (multipart web-upload) if ClawHub hasn't recorded it;
#   3. FORCE-syncs ClawHub: re-runs the security scan with update:true so a
#      pending version gets recorded, then points the `latest` tag at the target
#      (scripts/clawhub-force-sync.py, using CLAWHUB_TOKEN);
#   4. verifies ClawHub's live version now equals the target, failing loudly if
#      not (e.g. if the security scan legitimately rejects the version).
#
# No version number is committed back to the repo, so it can't drift ahead of
# ClawHub. To release a new version, bump SKILL.md/README/skill-card and push —
# this workflow then forces ClawHub to catch up.
#
# publish-to-clawhub.yml remains a manual (workflow_dispatch-only) option. Both
# share the `clawhub-publish` concurrency group (cancel-in-progress disabled)
# so a manual run and a push-triggered run can never publish concurrently.

on:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "skill-card.md"
      - "README.md"
      - "LICENSE"
      - "references/**"
      - "scripts/**"
      - "benchmark/**"
      - ".clawhubignore"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print payload, don't publish)"
        type: boolean
        default: false

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Resolve target + ClawHub state
        id: resolve
        run: |
          TARGET="$(python3 scripts/read-version.py)"
          python3 - "$TARGET" <<'PY'
          import json, os, sys
          from urllib.request import urlopen
          target = sys.argv[1]
          def get(url):
              with urlopen(url, timeout=60) as r:
                  return json.load(r)
          live = get("https://clawhub.ai/api/v1/skills/wcag-skill").get("latestVersion", {}).get("version", "") or ""
          recorded = {i.get("version") for i in get("https://clawhub.ai/api/v1/skills/wcag-skill/versions").get("items", [])}
          rec = "1" if target in recorded else "0"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"target={target}\nlive={live}\nrecorded={rec}\n")
          print(f"target(repo)={target}  clawhub-live={live}  target-already-recorded={target in recorded}")
          PY

      - name: Dry run
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::notice:: Dry run. Target=${{ steps.resolve.outputs.target }}, ClawHub live=${{ steps.resolve.outputs.live }}."
          python3 scripts/publish-web.py --dry-run --expected-version "${{ steps.resolve.outputs.target }}"

      - name: Publish to ClawHub (only if not yet recorded)
        if: ${{ inputs.dry_run != true && steps.resolve.outputs.target != steps.resolve.outputs.live && steps.resolve.outputs.recorded == '0' }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          python3 scripts/publish-web.py --expected-version "${{ steps.resolve.outputs.target }}"

      - name: Force-sync ClawHub live version to target
        if: ${{ inputs.dry_run != true && steps.resolve.outputs.target != steps.resolve.outputs.live }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          python3 scripts/clawhub-force-sync.py \
            --slug wcag-skill \
            --version "${{ steps.resolve.outputs.target }}" \
            --tag latest

      - name: Verify in sync
        if: ${{ inputs.dry_run != true && steps.resolve.outputs.target != steps.resolve.outputs.live }}
        run: |
          TARGET="${{ steps.resolve.outputs.target }}"
          LIVE="$(curl -sf https://clawhub.ai/api/v1/skills/wcag-skill | python3 -c 'import json,sys; print(json.load(sys.stdin).get("latestVersion",{}).get("version",""))')"
          if [ "$LIVE" = "$TARGET" ]; then
            echo "✅ In sync: ClawHub live and GitHub are both at $TARGET."
          else
            echo "::error:: Still out of sync after force-sync: ClawHub live=$LIVE, target=$TARGET."
            exit 1
          fi
