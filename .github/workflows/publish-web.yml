name: Publish to ClawHub (Web Upload)

# Active push-triggered publisher. Uses the multipart web-upload API path
# directly instead of the reusable CLI-based workflow
# (openclaw/clawhub/.github/workflows/skill-publish.yml), which currently
# has two known upstream bugs that block it: a server-side clock-domain
# bug on the ticket-upload path (openclaw/clawhub#3397, PR #3400), and an
# unhandled "pending-publication" status when a prior publish for the same
# version is still in security-scan review (run 33077893243). This
# workflow's own script (scripts/publish-web.py) treats a pending scan as
# a normal successful publish, so it isn't affected by either bug.
#
# The version is auto-incremented on every real publish by
# scripts/bump-skill-version.py, which bumps the patch component past
# whatever is highest of the checked-in SKILL.md version and every version
# ClawHub already has on record — so a run that silently published ahead of
# the repo (as happened once via the reusable workflow's
# "pending-publication" bug, run 35492158592) can't cause a version
# collision on the next publish. The bump is committed straight back to the
# branch with `[skip ci]` so it doesn't re-trigger this workflow.
#
# publish-to-clawhub.yml is kept as a manual (workflow_dispatch-only)
# option. Both workflows share the `clawhub-publish` concurrency group
# below (with cancel-in-progress disabled) so a manual run and a push-
# triggered run can never bump/publish concurrently — without that, both
# could read the same highest registry version, choose the same next
# patch, and race each other's push/publish.

on:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "skill-card.md"
      - "README.md"
      - "LICENSE"
      - "references/**"
      - "scripts/**"
      - "benchmark/**"
      - ".clawhubignore"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print payload, don't publish)"
        type: boolean
        default: false

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: "true"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Auto-increment skill version
        id: bump
        run: |
          version="$(python3 scripts/bump-skill-version.py --write)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice:: Next skill version: $version"

      - name: Commit version bump
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SKILL.md README.md skill-card.md
          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "ci: bump wcag-skill version to ${{ steps.bump.outputs.version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice:: Dry run — publishing would normally trigger here."
            python3 scripts/publish-web.py --dry-run
            exit 0
          fi
          python3 scripts/publish-web.py

      - name: Verify live version (post-publish)
        if: ${{ success() && inputs.dry_run != true }}
        run: |
          set -e
          VERSION=$(grep -m1 '^version:' SKILL.md | sed 's/.*:\s*"*'\''*//;s/"*'\''*$//')
          echo "Repository version: $VERSION"
          for i in $(seq 1 12); do
            LIVE=$(curl -sf https://clawhub.ai/api/v1/skills/wcag-skill \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['skill']['tags'].get('latest',''))")
            echo "Poll $i: live = $LIVE"
            if [ "$LIVE" = "$VERSION" ]; then
              echo "✅ ClawHub is now serving version $VERSION"
              exit 0
            fi
            sleep 15
          done
          echo "⚠ Live version still not updated after 3 minutes (security scan may be pending)"
          # Don't fail — the publish was accepted, just the scan is slow