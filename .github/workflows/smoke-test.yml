name: Skill smoke test

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "skill-card.md"
      - "scripts/**"
      - "references/**"
      - "benchmark/**"
      - "tests/**"
      - ".github/workflows/smoke-test.yml"
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "skill-card.md"
      - "scripts/**"
      - "references/**"
      - "benchmark/**"
      - "tests/**"
      - ".github/workflows/smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Run bundled smoke tests
        env:
          _JAVA_OPTIONS: "-Xmx256m -Xshare:off -Djava.io.tmpdir=/tmp"
          PATH: "./node_modules/.bin:${PATH}"
        run: bash tests/smoke-test.sh
