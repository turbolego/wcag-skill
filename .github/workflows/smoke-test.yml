name: Skill smoke test

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "skill-card.md"
      - "scripts/**"
      - "references/**"
      - "benchmark/**"
      - "tests/**"
      - ".github/workflows/smoke-test.yml"
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "skill-card.md"
      - "scripts/**"
      - "references/**"
      - "benchmark/**"
      - "tests/**"
      - ".github/workflows/smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Nu HTML Checker
        run: npm install --global vnu-jar
      - name: Run bundled smoke tests
        run: bash tests/smoke-test.sh
