name: Skill smoke test

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "README.md"
      - "skill-card.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "references/**"
      - "benchmark/**"
      - "docs/**"
      - "tests/**"
      - ".clawhubignore"
      - ".github/workflows/smoke-test.yml"
      - ".github/workflows/publish*.yml"
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "README.md"
      - "skill-card.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "references/**"
      - "benchmark/**"
      - "docs/**"
      - "tests/**"
      - ".clawhubignore"
      - ".github/workflows/smoke-test.yml"
      - ".github/workflows/publish*.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check release version consistency
        run: python3 scripts/read-version.py --check
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Install dependencies
        run: npm ci
      - name: Run bundled smoke tests
        env:
          _JAVA_OPTIONS: "-Xmx256m -Xshare:off -Djava.io.tmpdir=/tmp"
        run: |
          set -euxo pipefail
          bash -x tests/smoke-test.sh
