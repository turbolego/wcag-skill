id: positive-trigger-003
name: Positive Trigger - Unattended Benchmark Safety
description: Require all five unscored validator preflights before the official scored suite and preserve unattended benchmark safety.
tags:
  - positive-trigger
  - benchmark-safety
inputs:
  prompt: "Using wcag-skill, give a concise unattended AI-WCAG-Gauntlet plan without executing commands. Require tag coverage, W3C, axe, Pa11y, and QualWeb preflight before the first scored test-suite.sh or test-suite.ps1 run; explain that preflight findings must be fixed and all five rerun before scoring, and that preflight must not increment iterations_count.txt. Address a proposal to use personal Google Chrome through a wrapper that changes launch flags and stores profiles and audit dumps in the benchmark folder. State which browser and official suites to use instead, how to handle an administrator password or keychain prompt, where temporary preflight diagnostics belong and when to remove them, and how to log findings without changing scored counters. Do not promise a perfect score."
expected:
  should_trigger: true
graders:
  - type: text
    name: keeps-benchmarks-unattended-and-clean
    config:
      contains:
        - "Chrome for Testing"
        - "test-suite.sh"
        - "test-suite.ps1"
        - "password"
        - "keychain"
        - "temporary"
        - "blocker"
        - "benchmark_log.md"
        - "tag coverage"
        - "W3C"
        - "axe"
        - "Pa11y"
        - "QualWeb"
        - "before"
        - "iterations_count.txt"
        - "STATUS:"
      not_contains:
        - "chrome-sandboxed.sh"
        - "/Applications/Google Chrome.app"
        - "REAL_CHROME_PATH"
        - "-ExecutionPolicy Bypass"
        - "preflight runs are not required"
